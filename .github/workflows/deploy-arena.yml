# Deploys the Wildwood Arena Edge Function to Supabase after the test suite passes.
# One-time setup: add a repository secret SUPABASE_ACCESS_TOKEN (a personal access token from
# https://supabase.com/dashboard/account/tokens). Optionally set a repository variable SUPABASE_PROJECT_REF
# (defaults to the project in supabase/config.toml).
name: Deploy Arena function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'public/arena/src/**'
      - 'public/tactics/src/battle.js'
      - 'public/tactics/src/data.js'
      - 'public/tactics/src/grid.js'

concurrency:
  group: deploy-arena
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'xsjgycaytzqtnvesowdh' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the access token is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy the arena function (bundles supabase/functions/_shared)
        run: supabase functions deploy arena --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Smoke test (CORS preflight and an unauthenticated call)
        run: |
          url="https://$PROJECT_REF.supabase.co/functions/v1/arena"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$url")
          echo "OPTIONS → $code"; test "$code" = "200" -o "$code" = "204"
          body=$(curl -s -X POST "$url" -H 'content-type: application/json' -d '{"action":"me"}')
          echo "POST me (no session) → $body"
          echo "$body" | grep -qi 'error'
